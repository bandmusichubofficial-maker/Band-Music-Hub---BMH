<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Band Music Hub Admin</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#08080c;
    color:#fff;
}

.hidden{
    display:none !important;
}

header{
    height:70px;
    padding:0 22px;
    background:#0d0c11;
    border-bottom:1px solid #292831;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#ff3b35;
}

.logout{
    background:#302e37;
    color:#fff;
    border:0;
    border-radius:10px;
    padding:10px 16px;
    font-weight:bold;
    cursor:pointer;
}

main{
    max-width:1000px;
    margin:auto;
    padding:25px 15px 50px;
}

.card{
    background:#15141b;
    border:1px solid #302e38;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
}

.login-wrapper{
    min-height:calc(100vh - 70px);
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-card{
    width:100%;
    max-width:420px;
}

.login-icon{
    width:58px;
    height:58px;
    border-radius:16px;
    background:#ff3b35;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:bold;
    margin-bottom:20px;
}

h1{
    margin:0 0 8px;
}

h2{
    margin-top:0;
}

.subtitle{
    color:#9997a3;
    margin-bottom:25px;
}

label{
    display:block;
    margin:15px 0 7px;
    font-size:14px;
    font-weight:bold;
}

input,
textarea,
select{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #393740;
    background:#0c0b10;
    color:#fff;
    outline:none;
    font-size:15px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#ff3b35;
}

textarea{
    min-height:130px;
    resize:vertical;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 15px;
}

.full{
    grid-column:1 / -1;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#ff3b35;
    color:#fff;
}

.primary:hover{
    background:#dc2d28;
}

.secondary{
    background:#302e37;
    color:#fff;
}

.delete{
    background:#351719;
    color:#ff7772;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#25232c;
    color:#ddd;
    word-break:break-word;
}

.dashboard-header{
    margin-bottom:20px;
}

.dashboard-header h1{
    font-size:29px;
}

.dashboard-header p{
    color:#9997a3;
}

.event{
    background:#1b1a22;
    border:1px solid #34323c;
    border-radius:15px;
    padding:18px;
    margin-bottom:14px;
}

.event h3{
    margin:0 0 14px;
    font-size:20px;
}

.event-info{
    color:#bbb9c3;
    line-height:1.8;
    font-size:14px;
}

.event-info strong{
    color:#fff;
}

.description{
    color:#aaa8b2;
    line-height:1.6;
    margin-top:12px;
}

.poster-preview{
    width:100%;
    max-width:280px;
    aspect-ratio:4/5;
    object-fit:cover;
    display:none;
    margin-top:10px;
    border-radius:12px;
    border:1px solid #393740;
    background:#0c0b10;
}

.status{
    display:inline-block;
    margin-top:12px;
    padding:6px 12px;
    border-radius:20px;
    background:#302e37;
    font-size:12px;
    font-weight:bold;
}

.event-buttons{
    display:flex;
    gap:8px;
    margin-top:16px;
}

.empty{
    text-align:center;
    padding:30px;
    color:#9997a3;
}

@media(max-width:650px){

    header{
        height:64px;
        padding:0 14px;
    }

    .logo{
        font-size:19px;
    }

    main{
        padding:15px 12px 40px;
    }

    .card{
        padding:18px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .buttons{
        flex-direction:column;
    }

    .buttons button{
        width:100%;
    }

    .event-buttons button{
        flex:1;
    }
}
</style>
</head>


<body>


<header>

    <div class="logo">
        Band <span>Music Hub</span>
    </div>

    <button
        id="logoutBtn"
        class="logout hidden">
        Logout
    </button>

</header>


<main>


<!-- LOGIN -->

<section
    id="loginSection"
    class="login-wrapper">

    <div class="card login-card">

        <div class="login-icon">
            B
        </div>

        <h1>
            Admin Login
        </h1>

        <p class="subtitle">
            Login to manage concerts.
        </p>


        <label>
            Email
        </label>

        <input
            id="email"
            type="email"
            placeholder="Admin email">


        <label>
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Password">


        <div class="buttons">

            <button
                id="loginBtn"
                class="primary">
                Login
            </button>

        </div>


        <div id="loginMessage"></div>

    </div>

</section>



<!-- DASHBOARD -->

<section
    id="dashboard"
    class="hidden">


    <div class="dashboard-header">

        <h1>
            Admin Dashboard
        </h1>

        <p>
            Manage your concerts.
        </p>

    </div>



    <!-- ADD / EDIT FORM -->

    <div class="card">

        <h2 id="formTitle">
            Add Concert
        </h2>


        <div class="form-grid">


            <!-- DATE -->

            <div>

                <label>
                    Date
                </label>

                <input
                    id="date"
                    type="date">

            </div>



            <!-- TITLE -->

            <div>

                <label>
                    Title
                </label>

                <input
                    id="title"
                    type="text"
                    placeholder="Concert title">

            </div>



            <!-- TIME -->

            <div>

                <label>
                    Time
                </label>

                <input
                    id="time"
                    type="text"
                    placeholder="7:30 PM">

            </div>



            <!-- LOCATION -->

            <div>

                <label>
                    Location
                </label>

                <input
                    id="location"
                    type="text"
                    placeholder="Concert venue">

            </div>



            <!-- DESCRIPTION -->

            <div class="full">

                <label>
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Concert description"></textarea>

            </div>



            <!-- IMAGE URL -->

            <div class="full">

                <label>
                    image_url
                </label>

                <input
                    id="image_url"
                    type="url"
                    placeholder="https://...">

                <img
                    id="posterPreview"
                    class="poster-preview"
                    alt="Concert poster preview">

            </div>



            <!-- TICKET URL -->

            <div>

                <label>
                    ticket_url
                </label>

                <input
                    id="ticket_url"
                    type="url"
                    placeholder="https://...">

            </div>



            <!-- STATUS -->

            <div>

                <label>
                    Status
                </label>

                <select id="status">

                    <option value="Upcoming">
                        Upcoming
                    </option>

                    <option value="Live">
                        Live
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                    <option value="Cancelled">
                        Cancelled
                    </option>

                </select>

            </div>


        </div>



        <div class="buttons">

            <button
                id="saveBtn"
                class="primary">
                Publish Concert
            </button>

            <button
                id="updateBtn"
                class="primary hidden"
                type="button">
                Update Concert
            </button>

            <button
                id="cancelBtn"
                class="secondary hidden">
                Cancel Edit
            </button>

        </div>


        <div id="formMessage"></div>

    </div>



    <!-- CONCERT LIST -->

    <div class="card">

        <h2>
            Concerts
        </h2>

        <div id="concertList">
            Loading concerts...
        </div>

    </div>


</section>


</main>



<script>


/* SUPABASE */

const SUPABASE_URL =
"https://ddlabynkdnaemvdfrmce.supabase.co";


const SUPABASE_KEY =
"sb_publishable_NUOua2PDUwhgWnfg1rUWTg_tMhEeLgk";

let editingId = null;

let allConcerts = [];



function $(id){

    return document.getElementById(id);

}



/* LOGIN */

$("loginBtn").addEventListener(
    "click",
    login
);


$("password").addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);



async function login(){

    const email =
        $("email").value.trim();

    const password =
        $("password").value;

    const message =
        $("loginMessage");


    if(!email || !password){

        message.innerHTML =
            '<div class="message">Please enter email and password.</div>';

        return;

    }


    message.innerHTML =
        '<div class="message">Logging in...</div>';


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/token?grant_type=password",
                {
                    method:"POST",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        email:email,

                        password:password

                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.msg ||
                data.message ||
                "Login failed"
            );

        }


        localStorage.setItem(
            "bmh_access_token",
            data.access_token
        );


        showDashboard();

    }
    catch(error){

        message.innerHTML =
            '<div class="message">❌ ' +
            escapeHtml(error.message) +
            '</div>';

    }

}



/* SHOW DASHBOARD */

function showDashboard(){

    $("loginSection")
        .classList.add("hidden");


    $("dashboard")
        .classList.remove("hidden");


    $("logoutBtn")
        .classList.remove("hidden");


    loadConcerts();

}



/* LOGOUT */

$("logoutBtn").addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            "bmh_access_token"
        );

        location.reload();

    }
);



/* LOAD CONCERTS */

async function loadConcerts(){

    const list =
        $("concertList");


    list.innerHTML =
        "Loading concerts...";


    const token =
        localStorage.getItem(
            "bmh_access_token"
        );


    if(!token){

        location.reload();

        return;

    }


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/concerts?select=*&order=date.asc",
                {
                    method:"GET",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " + token

                    }
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                JSON.stringify(data)
            );

        }


        allConcerts =
            data;


        if(data.length === 0){

            list.innerHTML =
                '<div class="empty">No concerts found.</div>';

            return;

        }


        list.innerHTML =
            data.map(function(item){

                return `

                    <div class="event">

                        <h3>
                            ${escapeHtml(
                                item.title || "Untitled Concert"
                            )}
                        </h3>


                        <div class="event-info">

                            <strong>Date:</strong>
                            ${escapeHtml(
                                item.date || ""
                            )}

                            <br>

                            <strong>Time:</strong>
                            ${escapeHtml(
                                item.time || ""
                            )}

                            <br>

                            <strong>Location:</strong>
                            ${escapeHtml(
                                item.location || ""
                            )}

                        </div>


                        ${
                            item.description
                            ?
                            `
                            <div class="description">
                                ${escapeHtml(
                                    item.description
                                )}
                            </div>
                            `
                            :
                            ""
                        }


                        ${
                            item.image_url
                            ?
                            `
                            <img
                                src="${escapeHtml(item.image_url)}"
                                alt="Concert poster"
                                style="width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:14px;"
                                onerror="this.style.display='none'">
                            `
                            :
                            ""
                        }

                        <div class="status">

                            ${escapeHtml(
                                item.status || "Upcoming"
                            )}

                        </div>


                        <div class="event-buttons">

                            <button
                                class="secondary"
                                onclick="editConcert(${item.id})">
                                Edit
                            </button>


                            <button
                                class="delete"
                                onclick="deleteConcert(${item.id})">
                                Delete
                            </button>

                        </div>

                    </div>

                `;

            }).join("");


    }
    catch(error){

        list.innerHTML =
            '<div class="message">❌ ' +
            escapeHtml(error.message) +
            '</div>';

    }

}



/* SAVE CONCERT */

$("saveBtn").addEventListener(
    "click",
    saveConcert
);

$("updateBtn").addEventListener(
    "click",
    updateConcert
);

$("image_url").addEventListener("input", function(){
    updatePosterPreview(this.value);
});

function updatePosterPreview(url){
    const preview = $("posterPreview");
    if(!url){
        preview.style.display = "none";
        preview.removeAttribute("src");
        return;
    }
    preview.src = url;
    preview.style.display = "block";
    preview.onerror = function(){
        this.style.display = "none";
    };
}



async function saveConcert(){

    const message =
        $("formMessage");


    const date =
        $("date").value;

    const title =
        $("title").value.trim();

    const time =
        $("time").value.trim();

    const location =
        $("location").value.trim();

    const description =
        $("description").value.trim();

    const image_url =
        $("image_url").value.trim();

    const ticket_url =
        $("ticket_url").value.trim();

    const status =
        $("status").value;



    if(!date || !title){

        message.innerHTML =
            '<div class="message">' +
            'Date and Title are required.' +
            '</div>';

        return;

    }



    const record = {

        date:date,

        title:title,

        time:time,

        location:location,

        description:description,

        image_url:image_url,

        ticket_url:ticket_url,

        status:status

    };



    const token =
        localStorage.getItem(
            "bmh_access_token"
        );


    message.innerHTML =
        '<div class="message">Saving...</div>';



    try{

        let response;



        /* EDIT */

        if(editingId !== null){

            response =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/concerts?id=eq." +
                    editingId,
                    {
                        method:"PATCH",

                        headers:{

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " + token,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=minimal"

                        },

                        body:
                            JSON.stringify(record)

                    }
                );

        }



        /* ADD */

        else{

            response =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/concerts",
                    {
                        method:"POST",

                        headers:{

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " + token,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=minimal"

                        },

                        body:
                            JSON.stringify(record)

                    }
                );

        }



        if(!response.ok){

            const error =
                await response.text();

            throw new Error(error);

        }



        message.innerHTML =
            '<div class="message">' +
            '✅ Concert saved successfully.' +
            '</div>';


        clearForm();


        await loadConcerts();

    }
    catch(error){

        message.innerHTML =
            '<div class="message">❌ ' +
            escapeHtml(error.message) +
            '</div>';

    }

}



/* EDIT CONCERT */

function editConcert(id){

    const item =
        allConcerts.find(
            function(concert){

                return concert.id === id;

            }
        );


    if(!item){

        return;

    }


    editingId =
        id;


    $("formTitle").textContent =
        "Edit Concert";


    $("date").value =
        item.date || "";


    $("title").value =
        item.title || "";


    $("time").value =
        item.time || "";


    $("location").value =
        item.location || "";


    $("description").value =
        item.description || "";


    $("image_url").value =
        item.image_url || "";


    $("ticket_url").value =
        item.ticket_url || "";


    $("status").value =
        item.status || "Upcoming";


    $("saveBtn").textContent =
        "Update Concert";


    $("cancelBtn")
        .classList.remove("hidden");


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



/* UPDATE EXISTING CONCERT */

async function updateConcert(){
    if(editingId === null){
        $("formMessage").innerHTML =
            '<div class="message">Select a concert and press Edit first.</div>';
        return;
    }

    const message = $("formMessage");
    const token = localStorage.getItem("bmh_access_token");

    const record = {
        date: $("date").value,
        title: $("title").value.trim(),
        time: $("time").value.trim(),
        location: $("location").value.trim(),
        description: $("description").value.trim(),
        image_url: $("image_url").value.trim(),
        ticket_url: $("ticket_url").value.trim(),
        status: $("status").value
    };

    if(!record.date || !record.title){
        message.innerHTML =
            '<div class="message">Date and Title are required.</div>';
        return;
    }

    message.innerHTML =
        '<div class="message">Updating concert...</div>';

    try{
        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/concerts?id=eq." +
            encodeURIComponent(editingId),
            {
                method:"PATCH",
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":"Bearer " + token,
                    "Content-Type":"application/json",
                    "Prefer":"return=minimal"
                },
                body:JSON.stringify(record)
            }
        );

        if(!response.ok){
            const error = await response.text();
            throw new Error(error);
        }

        message.innerHTML =
            '<div class="message">✅ Concert updated successfully.</div>';

        clearForm();
        await loadConcerts();

    }catch(error){
        message.innerHTML =
            '<div class="message">❌ ' +
            escapeHtml(error.message) +
            '</div>';
    }
}


/* CANCEL EDIT */

$("cancelBtn").addEventListener(
    "click",
    clearForm
);



function clearForm(){

    editingId = null;


    $("formTitle").textContent =
        "Add Concert";


    $("date").value =
        "";


    $("title").value =
        "";


    $("time").value =
        "";


    $("location").value =
        "";


    $("description").value =
        "";


    $("image_url").value =
        "";


    $("ticket_url").value =
        "";


    $("status").value =
        "Upcoming";


    $("saveBtn").textContent =
        "Publish Concert";


    $("cancelBtn")
        .classList.add("hidden");


    $("formMessage").innerHTML =
        "";

}



/* DELETE */

async function deleteConcert(id){

    const item =
        allConcerts.find(
            function(concert){

                return concert.id === id;

            }
        );


    const title =
        item && item.title
        ?
        item.title
        :
        "this concert";


    const confirmed =
        confirm(
            'Delete "' +
            title +
            '"?'
        );


    if(!confirmed){

        return;

    }


    const token =
        localStorage.getItem(
            "bmh_access_token"
        );


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/concerts?id=eq." +
                id,
                {
                    method:"DELETE",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " + token

                    }
                }
            );


        if(!response.ok){

            const error =
                await response.text();

            throw new Error(error);

        }


        await loadConcerts();

    }
    catch(error){

        alert(
            "Delete failed: " +
            error.message
        );

    }

}



/* ESCAPE HTML */

function escapeHtml(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}



/* AUTO LOGIN */

if(
    localStorage.getItem(
        "bmh_access_token"
    )
){

    showDashboard();

}

</script>

</body>
</html>
