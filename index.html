<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Band Music Hub | Bangladesh Concerts</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#08080c;color:white}
header{background:#111116;border-bottom:1px solid #292930;position:sticky;top:0;z-index:10}
.nav{max-width:1100px;margin:auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold}
.logo span{color:#ff3b30}
nav a{color:#ddd;text-decoration:none;margin-left:20px}
.hero{max-width:1100px;margin:auto;text-align:center;padding:80px 20px}
.hero h1{font-size:48px;margin-bottom:18px}
.hero h1 span{color:#ff3b30}
.hero p{color:#aaa;font-size:18px}
.section{max-width:1100px;margin:auto;padding:20px 20px 70px}
h2{margin-bottom:25px}
.featured,.card{background:#15151b;border:1px solid #303039;border-radius:15px;overflow:hidden}
.featured{padding:30px;margin-bottom:60px}
.featured h3{font-size:30px;margin-bottom:15px}
.info{color:#aaa;margin:8px 0}
.btn{display:inline-block;background:#ff3b30;color:white;text-decoration:none;padding:12px 20px;border-radius:7px;margin-top:15px;font-weight:bold}
.events{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{padding:22px}
.card h3{margin-bottom:12px}
.loading{text-align:center;color:#aaa;padding:30px}
footer{text-align:center;border-top:1px solid #292930;padding:30px;color:#777}

@media(max-width:700px){
.hero h1{font-size:35px}
.events{grid-template-columns:1fr}
nav a{margin-left:10px;font-size:14px}
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">Band <span>Music Hub</span></div>
<nav>
<a href="#home">Home</a>
<a href="#concerts">Concerts</a>
</nav>
</div>
</header>

<section class="hero" id="home">
<h1>Discover <span>Live Music</span> in Bangladesh</h1>
<p>Find upcoming concerts, live music events and ticket information from across Bangladesh.</p>
</section>

<section class="section">

<h2>Featured Concert</h2>

<div class="featured" id="featured">
<div class="loading">Loading concert...</div>
</div>

<h2 id="concerts">Upcoming Concerts</h2>

<div class="events" id="events">
<div class="loading">Loading concerts...</div>
</div>

</section>

<footer>
© 2026 Band Music Hub<br>
Bangladesh Concert & Music Events
</footer>

<script>

/* ================================
   SUPABASE
   ================================ */

const SUPABASE_URL = "https://ddlabynkdnaemvdfrmce.supabase.co";

const SUPABASE_KEY = "sb_publishable_zi8cKWC-0qIGVVcU3r6hyw_mL0cecoc";


/* ================================
   LOAD DATA
   ================================ */

async function loadConcerts(){

try{

const response = await fetch(
SUPABASE_URL + "/rest/v1/concerts?select=*",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + SUPABASE_KEY
}
}
);

if(!response.ok){

throw new Error(
"Supabase request failed: " + response.status
);

}

const concerts = await response.json();

console.log("Concert data:",concerts);

showFeatured(concerts);

showConcerts(concerts);

}catch(error){

console.error(error);

document.getElementById("featured").innerHTML =
"<div class='loading'>Unable to load concert.</div>";

document.getElementById("events").innerHTML =
"<div class='loading'>Unable to load concerts.</div>";

}

}


/* ================================
   FEATURED
   ================================ */

function showFeatured(data){

const box=document.getElementById("featured");

if(!data.length){

box.innerHTML="<div class='loading'>No concert available.</div>";

return;

}

const c=data[0];

box.innerHTML=`

<h3>${c.title || c.concert || "Concert"}</h3>

<p class="info">📅 Date: ${c.date || "Coming Soon"}</p>

<p class="info">⏰ Time: ${c.time || "Coming Soon"}</p>

<p class="info">📍 Location: ${c.location || "Bangladesh"}</p>

<p class="info">${c.description || "Live music event in Bangladesh."}</p>

${c.ticket_url ? `<a class="btn" href="${c.ticket_url}" target="_blank">Get Tickets</a>` : ""}

`;

}


/* ================================
   CONCERT LIST
   ================================ */

function showConcerts(data){

const box=document.getElementById("events");

if(!data.length){

box.innerHTML="<div class='loading'>No upcoming concerts.</div>";

return;

}

box.innerHTML="";

data.forEach(c=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<h3>${c.title || c.concert || "Concert"}</h3>

<p class="info">📅 ${c.date || "Coming Soon"}</p>

<p class="info">⏰ ${c.time || "Coming Soon"}</p>

<p class="info">📍 ${c.location || "Bangladesh"}</p>

<p class="info">${c.description || ""}</p>

${c.ticket_url ? `<a class="btn" href="${c.ticket_url}" target="_blank">Buy Tickets</a>` : ""}

`;

box.appendChild(card);

});

}


/* ================================
   START
   ================================ */

loadConcerts();

</script>

</body>
</html>
