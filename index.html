<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Band Music Hub | Bangladesh Concerts</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #08080c;
      color: #ffffff;
    }

    a {
      text-decoration: none;
    }

    header {
      background: #101014;
      border-bottom: 1px solid #27272f;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      max-width: 1200px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .logo span {
      color: #ff3b30;
    }

    nav a {
      color: #ddd;
      margin-left: 25px;
      font-size: 14px;
    }

    nav a:hover {
      color: #ff3b30;
    }

    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 90px 20px 70px;
      text-align: center;
    }

    .hero h1 {
      font-size: 52px;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #ff3b30;
    }

    .hero p {
      color: #a5a5ad;
      font-size: 18px;
      max-width: 650px;
      margin: auto;
      line-height: 1.6;
    }

    .search-box {
      max-width: 600px;
      margin: 35px auto 0;
      display: flex;
      background: #15151b;
      border: 1px solid #303039;
      border-radius: 10px;
      overflow: hidden;
    }

    .search-box input {
      flex: 1;
      padding: 15px;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 15px;
    }

    .search-box button {
      background: #ff3b30;
      color: white;
      border: none;
      padding: 0 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .section {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px 70px;
    }

    .section-title {
      font-size: 30px;
      margin-bottom: 30px;
    }

    .featured {
      background: linear-gradient(135deg, #202028, #101014);
      border: 1px solid #303039;
      border-radius: 18px;
      padding: 35px;
      margin-bottom: 70px;
    }

    .featured h2 {
      font-size: 32px;
      margin-bottom: 18px;
    }

    .featured p {
      color: #b5b5bd;
      margin: 9px 0;
      line-height: 1.5;
    }

    .ticket-btn {
      display: inline-block;
      margin-top: 20px;
      background: #ff3b30;
      color: white;
      padding: 13px 24px;
      border-radius: 8px;
      font-weight: bold;
    }

    .events {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      background: #141419;
      border: 1px solid #292930;
      border-radius: 15px;
      overflow: hidden;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #44444e;
    }

    .poster {
      height: 210px;
      background: linear-gradient(135deg, #24242c, #17171d);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #777780;
      overflow: hidden;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 20px;
    }

    .card h3 {
      font-size: 20px;
      margin-bottom: 14px;
    }

    .info {
      color: #a8a8b0;
      font-size: 14px;
      margin: 8px 0;
    }

    .description {
      color: #9999a2;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 12px;
    }

    .loading,
    .empty {
      color: #9999a2;
      text-align: center;
      padding: 40px 10px;
    }

    footer {
      border-top: 1px solid #27272f;
      text-align: center;
      padding: 35px 20px;
      color: #777780;
      line-height: 1.7;
    }

    @media (max-width: 850px) {
      .events {
        grid-template-columns: 1fr 1fr;
      }

      .hero h1 {
        font-size: 40px;
      }
    }

    @media (max-width: 600px) {
      .navbar {
        padding: 15px;
      }

      nav a {
        margin-left: 12px;
      }

      .hero {
        padding: 65px 20px 50px;
      }

      .hero h1 {
        font-size: 34px;
      }

      .events {
        grid-template-columns: 1fr;
      }

      .featured {
        padding: 25px;
      }

      .featured h2 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="navbar">
    <div class="logo">
      Band <span>Music Hub</span>
    </div>

    <nav>
      <a href="#home">Home</a>
      <a href="#concerts">Concerts</a>
    </nav>
  </div>
</header>


<section class="hero" id="home">

  <h1>
    Discover <span>Live Music</span> in Bangladesh
  </h1>

  <p>
    Find upcoming concerts, live music events and ticket information from across Bangladesh.
  </p>

  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Search concerts...">
    <button onclick="searchConcerts()">Search</button>
  </div>

</section>


<section class="section">

  <h2 class="section-title">
    Featured Concert
  </h2>

  <div class="featured" id="featuredConcert">
    <div class="loading">
      Loading concert...
    </div>
  </div>


  <h2 class="section-title" id="concerts">
    Upcoming Concerts
  </h2>

  <div class="events" id="concertList">
    <div class="loading">
      Loading concerts...
    </div>
  </div>

</section>


<footer>
  © 2026 Band Music Hub
  <br>
  Bangladesh Concert & Music Events
</footer>


<script>

  const SUPABASE_URL = "https://ddlabynkdnaemvdfrmce.supabase.com";
  const SUPABASE_KEY = "sb_publishable_zi8cKWC-0qIGVVcU3r6hyw_mL0cecoc";

  let allConcerts = [];


  async function loadConcerts() {

    try {

      const response = await fetch(
        SUPABASE_URL + "/rest/v1/Band%20Music%20Hub?select=*",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        }
      );


      if (!response.ok) {
        throw new Error("Unable to load concerts");
      }


      const data = await response.json();

      allConcerts = data;

      displayFeatured(data);
      displayConcerts(data);

    } catch (error) {

      document.getElementById("featuredConcert").innerHTML =
        '<div class="empty">Concert information is currently unavailable.</div>';

      document.getElementById("concertList").innerHTML =
        '<div class="empty">Unable to load concerts.</div>';

      console.log(error);

    }

  }


  function getName(concert) {

    return concert.title ||
           concert.concert ||
           concert.name ||
           "Untitled Concert";

  }

    const box = document.getElementById("featuredConcert");

    if (!data || data.length === 0) {

      box.innerHTML =
        '<div class="empty">No featured concert available.</div>';

      return;
    }


    const concert = data[0];

    const name = getName(concert);

    box.innerHTML = `

      <h2>${name}</h2>

      <p>📅 Date: ${concert.date || "Coming Soon"}</p>

      <p>⏰ Time: ${concert.time || "Coming Soon"}</p>

      <p>📍 Location: ${concert.location || "Bangladesh"}</p>

      <p>
        ${concert.description || "Experience an unforgettable live music event."}
      </p>

      ${
        concert.ticket_url
        ? `<a href="${concert.ticket_url}" target="_blank" class="
